# Category → report field map of icl-motor-od.yaml (docs/09-template-model.md "Category → field map").
#
# For each evidence category (config/templates/_categories.yaml): the report fields a file of that category is
# evidence for, with a score 0–1 (how directly the file shows the field's value). When a file is labelled without
# the vision LLM (insurer file name, operator tag, office correction) its field matches come from this map:
# match score = map score × label confidence. Loaded with the template (`category_map:`), so a change here is a
# new template version; cases keep the version they started with.
#
# Every category is listed: `{}` means "reviewed, a file of this kind is evidence for no field of this template".
# `unmapped_fields` lists fields no file is evidence for (written by people from the visit, the enquiry or the
# conclusion). `npm run maps:check -w services/intake` reports categories and fields missing from both.
#
# Gap 23 (docs/14): this template has no chassis / engine number fields, so chassis_engine_photo only supports
# make_model until those fields are added.
generated_by: claude (semantic match, 2026-11-19)
reviewed: false

categories:
