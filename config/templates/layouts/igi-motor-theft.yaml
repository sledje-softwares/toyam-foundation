# Reliance / IndusInd — Motor Theft investigation report, derived from the OD layout (no theft sample exists; wording to be reviewed). Structure and fixed wording copied from the firm's sample
# (docs/13-report-layouts.md); every case value is a placeholder. Letterhead band, logo and company stamp are image
# files in assets/, cut from the firm's ICICI sample report and embedded by the template loader. No signature is included.
version: 1
name: Theft Investigation Report
page:
  size: A4
  margin_mm: {top: 39, right: 13, bottom: 20, left: 14}
  header_mm: 3
  footer_mm: 6
font: {family: Calibri, fallback: 'Carlito, Calibri, Arial, sans-serif', size_pt: 10, color: '#000000', line_height: 1.15}
paragraph_spacing_pt: 8
date_format: dd.MM.yyyy
datetime_format: dd.MM.yyyy hh:mm a
empty_value: NA

styles:
  justify: {align: justify}
  bold: {bold: true}
  title: {bold: true, align: center, space_after_pt: 4}
  label: {bold: true, color: '#1D3C74', background: '#D2EAF1'}
  label_italic: {use: label, italic: true}
  label_lavender: {bold: true, color: '#403151', background: '#DFD8E8'}
  label_center: {use: label, align: center}
  brand_orange: {font: Arial, size_pt: 22, bold: true, color: '#E36C0A'}
  brand_rest: {font: Arial, size_pt: 12, bold: true, color: '#000000'}
  reg_line: {size_pt: 8, bold: true, underline: true}
  foot: {size_pt: 10, align: center}
  center: {align: center}
  heading3: {size_pt: 10, bold: true, align: center, space_before_pt: 0, space_after_pt: 3}
  right: {align: right}

table_styles:
  blue:
    border: {width_pt: 0.5, color: '#2F5597'}
    padding_x_mm: 1.2
    padding_y_mm: 0.5
    label_style: label
    heading_style: {bold: true, align: center}
    space_after_pt: 14
  lavender: {use: blue, label_style: label_lavender, border: {width_pt: 0.5, color: '#7030A0'}}
  plain: {border: none, padding_x_mm: 0, padding_y_mm: 0, space_after_pt: 0}

assets:
  band_top: {file: assets/toyam-band-top.png}
  logo: {file: assets/toyam-logo.png}
  seal: {file: assets/toyam-seal.png}

header:
  - {type: image, asset: band_top, width_mm: 183, height_mm: 7, align: center}
  - {type: paragraph, text: 'Reg.No.U74999JH2018PTC010897', style: reg_line}
  - type: table
    columns: [14, 86]
    style: plain
    rows:
      - cells:
          - blocks: [{type: image, asset: logo, width_mm: 17.4, height_mm: 13}]
          - runs:
              - {text: 'TOYAM ', style: brand_orange}
              - {text: INVESTIGATION AND VALUATION PVT. LTD, style: brand_rest}
            valign: middle

footer:
  - {type: paragraph, text: '{{page}}', style: foot}

body:
  - {type: paragraph, text: Theft Investigation Report, style: title}

  - type: table
    columns: [27, 73]
    style: blue
    rows:
      - {heading: Insured Details}
      - {field: insured_name, label: 'Insured Name'}
      - {field: insurer_claim_no, label: 'Claim No'}
      - {field: policy_no, label: 'Policy Number'}
      - {field: present_address, label: 'Present Address'}
      - {field: permanent_address, label: 'Permanent address'}
      - {field: policy_address, label: 'Policy address'}
      - {field: insured_mobile, label: 'Insured Contact Number'}
      - {field: insured_email, label: 'Insured Email ID'}
      - {field: vehicle_no, label: 'Vehicle Number'}
      - {field: vehicle_class, label: 'Vehicle Type'}
      - cells:
          - {text: RCU Trigger, style: label}
          - blocks: [{type: list, field: investigation_points, split: auto, ordered: true, indent_mm: 9, empty_text: NA}]

  - type: table
    columns: [33, 33, 34]
    style: blue
    rows:
      - cells:
          - {text: Loss date and time, style: label_italic}
          - {text: Intimation to IGICL date Time, style: label_italic}
          - {text: Delay in intimation days, style: label_italic}
      - cells:
          - '{{field.loss_datetime|date:"dd.MM.yyyy ''at around'' hh:mm a"}}'
          - '{{field.intimation_datetime|date:"dd.MM.yyyy ''at'' hh:mm a"}}'
          - '{{field.intimation_delay_days|suffix:" days"}}'
      - {field: delay_reason, label: 'Reason for Delay in intimation'}
      - {field: policy_no, label: 'Policy no.'}
      - {field: policy_type, label: 'Policy Type'}
      - {field: policy_period, label: 'Policy period'}
      - {field: within_policy_period, label: 'Is the loss within policy period'}
      - {field: rollover_policy_no, label: 'If rollover, then Policy Number'}
      - {field: previous_year_claim, label: 'Any claim lodged in previous year over policy’s'}
      - {field: close_proximity, label: 'Claim is in close proximity'}

  - type: table
    columns: [33, 33, 34]
    style: blue
    rows:
      - {heading: Basic Details}
      - cells:
          - {text: Loss date and time as per claim form, style: label_italic}
          - {text: Loss date and time as per intimation / Written statement, style: label_italic}
          - {text: Loss date and time as per FIR / GD, style: label_italic}
      - cells: ['{{field.loss_dt_claim_form}}', '{{field.loss_dt_statement}}', '{{field.loss_dt_fir}}']
      - {field: mismatch_reason, label: 'If Mismatching, then reason'}
      - {field: brief_remarks, label: 'Brief Remarks of the Theft:', value_style: justify}

  - type: table
    columns: [27, 73]
    style: blue
    rows:
      - {heading: Theft Details}
      - {field: loss_type, label: 'Loss Type Desc'}
      - {field: loss_type_secondary, label: 'Secondary Type of Loss'}
      - {field: cause_of_loss_intimated, label: 'Cause of loss as intimated', value_style: justify}
      - {field: loss_location, label: 'Location of Loss as intimated'}
      - {field: parked_place, label: 'Place where the vehicle was parked', value_style: justify}
      - {field: parked_datetime, label: 'Date and time parked'}
      - {field: missing_datetime, label: 'Date and time noticed missing'}
      - {field: noticed_by, label: 'Who noticed the vehicle missing'}
      - {field: security_measures, label: 'How the vehicle was secured', value_style: justify}
      - {field: vehicle_recovered, label: 'Vehicle recovered'}
      - {field: theft_remarks, label: 'Any Other details regarding the Theft', value_style: justify}

  - type: table
    columns: [27, 73]
    style: blue
    rows:
      - {heading: Keys}
      - {field: keys_issued, label: 'Number of keys issued with the vehicle'}
      - {field: keys_submitted, label: 'Number of keys submitted to the insurer'}
      - {field: key_missing_detail, label: 'Any key missing or duplicated', value_style: justify}
      - {field: key_remarks, label: 'Observation on the keys', value_style: justify}

  - type: table
    columns: [100]
    style: blue
    when: {photos: keys}
    rows:
      - keep_together: true
        cells:
          - blocks: [{type: heading, text: VEHICLE PHOTOS, level: 3}, {type: photos, section: keys, columns: 2, max_height_mm: 58, gap_mm: 0, captions: false, border: {width_pt: 0.5, color: '#2F5597'}}]

  - type: table
    columns: [27, 73]
    style: blue
    rows:
      - {heading: 'Ownership, Sale and RTO Check'}
      - {field: sold_check, label: 'Was the vehicle sold or transferred'}
      - {field: sold_details, label: 'If yes, buyer and details', value_style: justify}
      - {field: rto_transfer_check, label: 'Transfer of ownership recorded at RTO'}
      - {field: transfer_forms, label: 'Forms and NOC found (Form 28 / 29 / 30, NOC)', value_style: justify}
      - {field: papers_genuine, label: 'Vehicle papers found genuine'}
      - {field: rto_remarks, label: 'RTO verification remarks', value_style: justify}

  - type: table
    columns: [100]
    style: blue
    when: {photos: ownership}
    rows:
      - keep_together: true
        cells:
          - blocks: [{type: heading, text: OWNERSHIP DOCUMENTS, level: 3}, {type: photos, section: ownership, columns: 1, max_height_mm: 120, gap_mm: 0, captions: false, border: {width_pt: 0.5, color: '#2F5597'}}]

  - type: table
    columns: [27, 73]
    style: blue
    rows:
      - {heading: Finance / Hypothecation}
      - {field: financed, label: 'Vehicle under finance'}
      - {field: financer_name, label: 'Financer name and branch'}
      - {field: loan_status, label: 'Loan status'}
      - {field: loan_statement, label: 'Loan statement obtained'}
      - {field: non_repossession_letter, label: 'Non-repossession letter from the financer'}
      - {field: finance_remarks, label: 'Finance remarks', value_style: justify}

  - type: table
    columns: [100]
    style: blue
    when: {photos: finance}
    rows:
      - keep_together: true
        cells:
          - blocks: [{type: heading, text: FINANCE DOCUMENTS, level: 3}, {type: photos, section: finance, columns: 1, max_height_mm: 120, gap_mm: 0, captions: false, border: {width_pt: 0.5, color: '#2F5597'}}]

  - type: table
    columns: [27, 73]
    style: blue
    rows:
      - {heading: 'CCTV, Mobile Location and Call Records'}
      - {field: cctv_checked, label: 'CCTV footage of the parking place checked'}
      - {field: cctv_details, label: 'CCTV findings', value_style: justify}
      - {field: mobile_location, label: 'Mobile location of the last user of the vehicle', value_style: justify}
      - {field: call_records, label: 'Call records / timeline checked', value_style: justify}
      - {field: tracker_gps, label: 'Tracker / GPS details', value_style: justify}

  - type: table
    columns: [100]
    style: blue
    when: {photos: tracking}
    rows:
      - keep_together: true
        cells:
          - blocks: [{type: heading, text: CCTV AND LOCATION EVIDENCE, level: 3}, {type: photos, section: tracking, columns: 2, max_height_mm: 58, gap_mm: 0, captions: false, border: {width_pt: 0.5, color: '#2F5597'}}]

  # FIR / GD: when the office recorded an FIR, label / value rows; otherwise the sample's label list beside one
  # merged value (the narration, normally "no FIR was lodged ...").
  - type: table
    columns: [27, 73]
    style: blue
    when: {field: fir_no_date}
    rows:
      - {heading: FIR / GD Details}
      - {field: fir_no_date, label: 'FIR / GD date and No'}
      - {field: fir_delay, label: 'Any Delay in FIR / GD and reason'}
      - {field: police_station, label: 'Police Station Name and address'}
      - {field: io_details, label: 'Investigation office Name and contact number of IO'}
      - {field: fir_narration, label: 'Brief FIR / GD Narration', value_style: justify}
      - {field: untraced_report, label: 'Final / Untraced Report No and date'}
      - {field: untraced_court, label: 'Court acceptance of the final report'}
      - {field: police_followup, label: 'Police follow-up and investigation status', value_style: justify}
  - type: table
    columns: [27, 73]
    style: blue
    when: {field: fir_no_date, filled: false}
    rows:
      - {heading: FIR / GD Details}
      - cells:
          - 'Accident Date'
          - {text: '{{field.fir_narration}}', rowspan: 11, valign: middle}
      - cells: ['FIR / GD date and No']
      - cells: ['Any Delay in FIR / GD']
      - cells: ['Reason for delay']
      - cells: ['Accused Name']
      - cells: ['Complainant']
      - cells: ['Police Station Name']
      - cells: ['Address of Police station with Pin code']
      - cells: ['Investigation office Name']
      - cells: ['Contact number of IO']
      - cells: ['Brief FIR / GD Narration']

  - type: table
    columns: [27, 73]
    style: blue
    when: {field: fir_no_date, filled: false}
    rows:
      - {heading: Final / Untraced Report}
      - {field: untraced_report, label: 'Final / Untraced Report No and date'}
      - {field: untraced_court, label: 'Court acceptance of the final report'}
      - {field: police_followup, label: 'Police follow-up and investigation status', value_style: justify}

  - type: table
    columns: [100]
    style: blue
    when: {photos: fir}
    rows:
      - keep_together: true
        cells:
          - blocks: [{type: heading, text: FIR / GD AND POLICE DOCUMENTS, level: 3}, {type: photos, section: fir, columns: 1, max_height_mm: 120, gap_mm: 0, captions: false, border: {width_pt: 0.5, color: '#2F5597'}}]

  - type: table
    columns: [27, 73]
    style: blue
    rows:
      - {heading: Vehicle Registration Details}
      - {field: reg_number, label: 'Registration Number'}
      - {field: reg_date, label: 'Registration Date'}
      - {field: reg_rto, label: 'Registration RTO'}
      - {field: vehicle_class, label: 'Vehicle Type'}
      - {field: vehicle_make, label: 'Vehicle Make'}
      - {field: vehicle_model, label: 'Vehicle Model'}
      - {field: fuel_type, label: 'Fuel Type'}
      - {field: seating_capacity, label: 'Seating Capacity'}
      - {field: engine_no, label: 'Engine Number'}
      - {field: chassis_no, label: 'Chassis Number'}
      - {field: modifications, label: 'Any Modifications in Vehicle'}
      - {field: hypothecation, label: 'Any Other observation during Investigation', value_style: justify}

  - type: table
    columns: [100]
    style: blue
    when: {photos: registration}
    rows:
      - keep_together: true
        cells:
          - blocks: [{type: heading, text: RC AND CHASSIS / ENGINE PHOTOS, level: 3}, {type: photos, section: registration, columns: 2, max_height_mm: 58, gap_mm: 0, captions: false, border: {width_pt: 0.5, color: '#2F5597'}}]

  - type: table
    columns: [27, 73]
    style: blue
    rows:
      - {heading: 'Spot Verification (Parking Place)'}
      - {field: spot_matches, label: 'Intimation / Claim form spot location matching??'}
      - {field: actual_spot, label: 'If No kindly provide the proper Loss location details.'}
      - {field: spot_witness, label: 'Spot Witness Name _1'}
      - {field: spot_details, label: 'Any Other details regarding the Spot', value_style: justify}

  - type: table
    columns: [100]
    style: blue
    when: {photos: spot}
    rows:
      - keep_together: true
        cells:
          - blocks: [{type: heading, text: SPOT PHOTOS, level: 3}, {type: photos, section: spot, columns: 2, max_height_mm: 58, gap_mm: 0, captions: false, border: {width_pt: 0.5, color: '#2F5597'}}]

  - type: table
    columns: [30, 70]
    style: blue
    rows:
      - {heading: Written Statement Collect}
      - cells:
          - {text: Name and Relation with the insured, style: label}
          - {text: Statement Version, style: label_center}
      - repeat: {field: statements, split: sections}
        cells:
          - {text: '{{item|first_line}}', style: bold}
          - {text: '{{item|rest_lines}}', style: justify}
        empty:
          - {text: NA, colspan: 2}

  - type: table
    columns: [100]
    style: blue
    when: {photos: statements}
    rows:
      - keep_together: true
        cells:
          - blocks: [{type: heading, text: STATEMENT AND IDENTITY DOCUMENTS, level: 3}, {type: photos, section: statements, columns: 2, max_height_mm: 58, gap_mm: 0, captions: false, border: {width_pt: 0.5, color: '#2F5597'}}]

  - type: table
    columns: [100]
    style: blue
    rows:
      - {heading: Observation / Findings During investigation}
      - cells:
          - blocks: [{type: list, field: findings, split: auto, ordered: true, indent_mm: 9, style: justify, empty_text: NA}]

  - type: table
    columns: [100]
    style: blue
    when: {photos: findings}
    rows:
      - keep_together: true
        cells:
          - blocks: [{type: heading, text: CHALLAN AND OTHER CHECKS, level: 3}, {type: photos, section: findings, columns: 2, max_height_mm: 58, gap_mm: 0, captions: false, border: {width_pt: 0.5, color: '#2F5597'}}]

  - type: table
    columns: [10, 90]
    style: blue
    rows:
      - {heading: Documents Collection}
      - cells: [{text: Sr. no., style: label}, {text: Documents Name, style: label}]
      - repeat: {field: documents_collected, split: auto}
        cells: [{text: '{{index}}.', style: right}, '{{item}}']
        empty:
          - {text: NA, colspan: 2}

  - type: table
    columns: [27, 73]
    style: blue
    rows:
      - {heading: Reminder Letter / Document Deficiency Letter}
      - cells: [{text: 1st Letter Date, style: label}, '{{field.reminder_1_date}}']
        height_mm: 9
      - cells: [{text: 2nd Letter Date, style: label}, '{{field.reminder_2_date}}']
        height_mm: 9
      - cells: [{text: Document Deficiency List, style: label}, '{{field.deficiency_list}}']
        height_mm: 9

  - type: table
    columns: [100]
    style: blue
    when: {photos: reminders}
    rows:
      - keep_together: true
        cells:
          - blocks: [{type: heading, text: LETTERS AND PROOF OF DISPATCH, level: 3}, {type: photos, section: reminders, columns: 1, max_height_mm: 120, gap_mm: 0, captions: false, border: {width_pt: 0.5, color: '#2F5597'}}]
  - type: table
    columns: [100]
    style: blue
    rows:
      - {heading: Conclusion}
      - cells:
          - {text: '{{field.conclusion}}', style: justify, markup: true}

  - type: table
    columns: [27, 73]
    style: blue
    rows:
      - {field: investigation_status, label: 'Investigation Status'}
      - {field: repudiate_ground, label: 'Repudiate Ground, value_style: bold'}
      - cells: [{text: Investigation Agency Name, style: label}, 'Toyam Investigation and Valuation Pvt. Ltd']
      - {field: submission_date, label: 'Report Submission Date'}
      - cells:
          - {text: Seal and Stamp, style: label}
          - blocks: [{type: image, asset: seal, max_height_mm: 28}]
        height_mm: 32

  - {type: paragraph, text: 'The report is being issued strictly without Prejudice, Strictly Confidential and Strictly for the purpose of Insurance Company’s claim settlement purpose only.', style: justify}
  - {type: paragraph, text: 'Our bill for the services rendered is being enclosed herewith for your early clearance.', style: justify}
  - {type: paragraph, text: Thanking you}
  - type: table
    columns: [50, 50]
    style: plain
    rows:
      - cells:
          - Yours Sincerely
          - {text: 'Compiled by: {{field.compiled_by}}', style: right}
