# Reliance General (now IndusInd General Insurance; mails from indusindinsurance.com, RCU dept.)
# Motor — Own Damage. Built from a sample case ("OD || <claim no> || <insured> || TWL") and its
# investigation report (reliance od/ in the repo root). Load with public.load_case_template().
#
# insurer_code must match the insurer created in Admin → Insurers (code is a placeholder: confirm).
insurer_code: IGI
claim_type: motor
variant: od
name: IndusInd (Reliance) — Motor OD investigation
requires_approval: true
output_formats: [pdf, docx]
default_output_format: pdf
docx_template_path: report-templates/igi-motor-od.docx   # upload the firm's Word layout here
report_layout: layouts/igi-motor-od.yaml   # structured copy of the insurer layout (docs/13-report-layouts.md)

intake_rules:
  sender_domains: [indusindinsurance.com]
  # e.g. "OD || 3100000001 || Ravi Sharma || TWL"  (variant, claim no, insured, vehicle class)
  subject_pattern: '^(?:(?:re|fw|fwd):\s*)*(OD|THEFT)\s*\|\|\s*(\d{6,})\s*\|\|\s*([^|]+?)\s*\|\|\s*([A-Z]+)\s*$'
  subject_groups: {variant: 1, insurer_claim_no: 2, insured_name: 3, vehicle_class: 4}
  # The body has a two-column "Claim Intimation Details" table: label then value.
  table_parser: label_value_two_column
  # Numbered "Please ensure the following points…" list becomes the investigation points
  investigation_points: {starts_after: 'following points', until: 'Claim Intimation Details'}

report_email:
  reply_on_thread: true
  cc_from_original: true
  subject: 'Re: {{original_subject}}'
  attachment_name: '{{insurer_claim_no}}_{{insured_name}}_IR'

checklists:
  - {name: Motor OD — garage and spot visit, default: true}

sections:
  - key: insured
    title: Insured details
    fields:
      - {key: insured_name, label: Insured name, source: intake, required: true, extract: {labels: [Insured Name]}}
      - {key: insurer_claim_no, label: Claim no, source: intake, required: true, extract: {labels: [Claim Number]}}
      - {key: policy_no, label: Policy number, source: intake, required: true, extract: {labels: [Policy Number]}}
      - {key: present_address, label: Present address, type: long_text}
      - {key: permanent_address, label: Permanent address, type: long_text}
      - {key: policy_address, label: Policy address, type: long_text, source: intake, extract: {labels: [Address Line 1, Address Line 2, City, State, PinCode], within: Insured Details}}
      - {key: insured_mobile, label: Insured contact number, source: intake, extract: {labels: [Mobile Number], within: Insured Details}}
      - {key: insured_email, label: Insured email ID, source: intake, extract: {labels: [Email Id], within: Insured Details}}
      - {key: vehicle_no, label: Vehicle number, source: intake, extract: {labels: [Vehicle Number]}}
      - {key: vehicle_class, label: Vehicle type, source: intake, help: 'From the subject, e.g. TWL'}
      - {key: investigation_points, label: RCU trigger (points to address), type: long_text, source: intake, help: 'Numbered points, one per line; printed as a numbered list'}

  - key: loss_and_policy
    title: Loss, intimation and policy
    fields:
      - {key: loss_datetime, label: Loss date and time, type: datetime, source: intake, extract: {labels: [Date Of Loss, Time of Loss]}}
      - {key: intimation_datetime, label: Intimation to insurer date and time, type: datetime, source: intake, extract: {labels: [Intimation Date, Intimation Time]}}
      - {key: intimation_delay_days, label: Delay in intimation (days), type: number, help: 'Computed from the two dates; confirm'}
      - {key: delay_reason, label: Reason for delay in intimation, type: long_text, source: intake, extract: {labels: [Reason For Delay in Intimation]}}
      - {key: policy_type, label: Policy type, source: intake, extract: {labels: [Product]}}
      - {key: policy_period, label: Policy period, source: intake, extract: {labels: [Start Date, End Date]}}
      - {key: within_policy_period, label: Is the accident within policy period, type: choice, options: ['Yes', 'No']}
      - {key: rollover_policy_no, label: 'If rollover, policy number'}
      - {key: previous_year_claim, label: Any claim lodged in previous year, type: choice, options: ['Yes', 'No', 'Not known']}
      - {key: close_proximity, label: Claim in close proximity, type: choice, options: ['Yes', 'No']}

  - key: basic_details
    title: Basic details
    fields:
      - {key: loss_dt_claim_form, label: Loss date/time as per claim form}
      - {key: loss_dt_statement, label: Loss date/time as per intimation / written statement}
      - {key: loss_dt_fir, label: Loss date/time as per FIR / GD}
      - {key: mismatch_reason, label: 'If mismatching, reason', type: long_text}
      - {key: brief_remarks, label: Brief remarks of the accident, type: long_text, required: true}

  - key: accident
    title: Accident details
    categories: [spot_photo, cctv_footage, location_timeline]
    fields:
      - {key: loss_type, label: Loss type, source: intake, extract: {labels: [Primary Type Of Loss]}}
      - {key: vehicle_burnt, label: Vehicle burnt, type: choice, options: ['Yes', 'No']}
      - {key: origin_of_fire, label: Origin of fire}
      - {key: vehicles_involved, label: No. of vehicles involved, type: number}
      - {key: occupants, label: No. of occupants, type: number}
      - {key: occupant_relation, label: Relation of occupant/driver with insured}
      - {key: insured_travelling, label: Is insured travelling, type: choice, options: ['Yes', 'No']}
      - {key: purpose_of_travel, label: Purpose of travel}
      - {key: tp_involved, label: Any TP accident involved, type: choice, options: ['Yes', 'No']}
      - {key: travel_from_date, label: Travelling from date, type: date}
      - {key: travel_to_date, label: Travelling to date, type: date}
      - {key: travel_from_location, label: Travelling from location}
      - {key: travel_to_location, label: Travelling to location}
      - {key: possession_other, label: If possession other than self}
      - {key: anyone_injured, label: Anyone travelling injured / dead, type: choice, options: ['Yes', 'No']}
      - {key: cause_of_loss_intimated, label: Cause of loss as intimated, type: long_text, source: intake, extract: {labels: [Cause/Description Of Loss]}}

  - key: fir
    title: FIR / GD details
    categories: [fir_police_document]
    fields:
      - {key: fir_no_date, label: FIR / GD date and number}
      - {key: fir_delay, label: Any delay in FIR / GD and reason, type: long_text}
      - {key: police_station, label: Police station name and address}
      - {key: io_details, label: Investigating officer and contact}
      - {key: fir_narration, label: Brief FIR / GD narration, type: long_text}

  - key: driver
    title: Driver details
    categories: [dl_document]
    fields:
      - {key: driver_name, label: Driver name, source: intake, extract: {labels: [Name], within: Driver Details}}
      - {key: driver_dob, label: Driver DOB as per DL, type: date}
      - {key: driver_address, label: Driver resident address, type: long_text}
      - {key: driver_contact, label: Driver contact number}
      - {key: driver_relation, label: Relation with the insured}
      - {key: dl_number, label: DL number of the driver, help: 'Copy from the DL extract (tap-to-fill)'}
      - {key: dl_authority, label: DL issuing authority}
      - {key: dl_type, label: Type of licence, type: choice, options: [Permanent, Learner]}
      - {key: dl_classes, label: Vehicle classes authorised}
      - {key: dl_validity, label: Licence validity}
      - {key: dl_valid_at_loss, label: Licence valid at time of accident, type: choice, options: ['Yes', 'No']}
      - {key: driver_remarks, label: Other remarks regarding the driver, type: long_text}

  - key: garage
    title: Garage details
    categories: [job_card, estimate, vehicle_photo, odometer_photo, towing_bill]
    fields:
      - {key: garage_name, label: Garage name, source: intake, extract: {labels: [Garage Name], within: Garage Details}}
      - {key: garage_address, label: Garage address, source: intake, extract: {labels: [Garage Address, Garage City, Garage PinCode], within: Garage Details}}
      - {key: garage_contact, label: Garage contact number}
      - {key: garage_entry, label: Vehicle entry date and time}
      - {key: job_card_no, label: Job card number}
      - {key: odometer_at_entry, label: Odometer reading at entry}
      - {key: loss_to_entry_gap, label: Difference between loss date and garage entry}
      - {key: garage_gap_reason, label: Reason, type: long_text}
      - {key: not_reported_reason, label: 'If not reported to any garage till date, reason', type: long_text}

  - key: registration
    title: Vehicle registration details
    categories: [rc_document, chassis_engine_photo]
    fields:
      - {key: reg_number, label: Registration number}
      - {key: reg_date, label: Registration date, type: date}
      - {key: reg_rto, label: Registration RTO}
      - {key: vehicle_make, label: Vehicle make, source: intake, extract: {labels: [Make]}}
      - {key: vehicle_model, label: Vehicle model, source: intake, extract: {labels: [Model]}}
      - {key: fuel_type, label: Fuel type}
      - {key: seating_capacity, label: Seating capacity, type: number}
      - {key: engine_no, label: Engine number}
      - {key: chassis_no, label: Chassis number}
      - {key: modifications, label: Any modifications in vehicle, type: choice, options: ['Yes', 'No']}
      - {key: hypothecation, label: Hypothecation / other observation, type: long_text}

  - key: commercial
    title: If vehicle commercial
    guidance: Leave as "Not applicable" for private vehicles.
    fields:
      - {key: commercial_details, label: 'Load, permit, fitness and transporter details', type: long_text, help: 'Printed in one merged cell beside the 13 commercial-vehicle rows of the report'}

  - key: spot
    title: Spot verification
    categories: [spot_photo]
    fields:
      - {key: spot_matches, label: Intimation / claim form spot matching, type: choice, options: ['Yes', 'No']}
      - {key: actual_spot, label: 'If no, proper loss location'}
      - {key: spot_witness, label: Spot witness name(s)}
      - {key: spot_details, label: Other details regarding the spot, type: long_text}

  - key: injured
    title: Injured details
    categories: [medical_document]
    fields:
      - {key: injured_details, label: 'Name, age, occupation, nature of injury, treatment and hospital', type: long_text, help: 'Printed in one merged cell beside the nine injured-person rows of the report'}
      - {key: injury_observation, label: Observation during investigation, type: long_text}

  - key: statements
    title: Written statements
    categories: [written_statement, avr_recording, insured_photo, id_document]
    fields:
      - {key: statements, label: 'Statements (name, relation, version)', type: long_text, required: true, help: 'One statement per block, blocks separated by a line with --- ; the first line of a block is the name and relation (e.g. Mr. X (Rider''s Statement)), the rest is the statement'}

  - key: findings
    title: Observations / findings
    categories: [echallan_check, location_timeline]
    fields:
      - {key: findings, label: Observations and findings (numbered), type: long_text, required: true, help: 'Start each finding with 1. 2. 3. ; lines that follow belong to the same finding; blank line for a new paragraph inside it'}
      - {key: documents_collected, label: Documents collected, type: long_text, help: 'One document per line (or numbered); blank lines are ignored'}

  - key: reminders
    title: Reminder letter / document deficiency letter
    categories: [reminder_letter, proof_of_dispatch]
    fields:
      - {key: reminder_1_date, label: 1st letter date, type: date}
      - {key: reminder_2_date, label: 2nd letter date, type: date}
      - {key: deficiency_list, label: Document deficiency list, type: long_text}

  - key: conclusion
    title: Conclusion
    fields:
      - {key: conclusion, label: Conclusion, type: long_text, required: true}
      - {key: investigation_status, label: Investigation status, type: choice, required: true, options: [Recommended, Repudiate, Insurer discretion]}
      - {key: repudiate_ground, label: Repudiate ground}
      - {key: submission_date, label: Report submission date, type: date}
      - {key: compiled_by, label: Compiled by}
